# ConfigMap for non-sensitive configuration
{{- if .Values.configMap.create }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "todo-chatbot.fullname" . }}-config
  labels:
    {{- include "todo-chatbot.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.configMap.data.LOG_LEVEL | default "INFO" | quote }}
  FRONTEND_URL: {{ .Values.configMap.data.FRONTEND_URL | default "http://todo.local" | quote }}
  NEXT_PUBLIC_BACKEND_URL: {{ .Values.frontend.env.NEXT_PUBLIC_BACKEND_URL | quote }}
  BACKEND_URL: {{ .Values.frontend.env.BACKEND_URL | default "http://todo-chatbot-backend:8000" | quote }}
{{- end }}
