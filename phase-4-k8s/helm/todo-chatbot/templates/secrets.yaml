# Secrets for sensitive configuration
# NOTE: In production, use external secret management (e.g., Vault, AWS Secrets Manager)
{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "todo-chatbot.fullname" . }}-secrets
  labels:
    {{- include "todo-chatbot.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.backend.env.DATABASE_URL | quote }}
  OPENAI_API_KEY: {{ .Values.backend.env.OPENAI_API_KEY | quote }}
  BETTER_AUTH_SECRET: {{ .Values.backend.env.BETTER_AUTH_SECRET | quote }}
{{- end }}
